<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZipStore — Admin Login</title>
<link rel="preconnect" href="https://zip-backend-myp0.onrender.com" crossorigin>
<link rel="dns-prefetch" href="https://zip-backend-myp0.onrender.com">
<link rel="preconnect" href="https://placehold.co">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/loader.css">
</head>
<body class="login-body">
<div id="app-loader" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fff">
<div class="loader-inner">
<div class="loader-logo-wrap">
<div class="loader-spinner"></div>
<div class="loader-logo">
<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
</div>
</div>
<div class="loader-name">ZipStore</div>
<div class="loader-text">Preparing your shopping experience<span class="loader-dots"></span></div>
<div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>
</div>
<div class="login-card">
<h1>ZipStore</h1>
<p>Admin dashboard login</p>
<form id="login-form">
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" required placeholder="admin@zipstore.com">
</div>
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" required placeholder="Enter your password">
</div>
<button type="submit" class="btn btn-secondary btn-block">Sign In</button>
<p id="login-error" style="color:var(--color-error);font-size:var(--font-size-sm);margin-top:var(--space-3);text-align:center;display:none"></p>
</form>
<p style="margin-top:var(--space-6);text-align:center;font-size:var(--font-size-xs);color:var(--color-text-secondary)">
<a href="index.html" style="color:var(--color-primary)">Back to store</a>
</p>
</div>
<script>
const API_BASE_URL = 'https://zip-backend-myp0.onrender.com/api';
const form = document.getElementById('login-form');
const errorEl = document.getElementById('login-error');
const token = localStorage.getItem('zipstore_token');
if (token) {
window.location.href = 'admin.html';
}
form.addEventListener('submit', async (e) => {
e.preventDefault();
errorEl.style.display = 'none';
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;
try {
const res = await fetch(`${API_BASE_URL}/auth/login`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ email, password }),
});
if (!res.ok) {
const data = await res.json();
throw new Error(data.error || 'Login failed');
}
const data = await res.json();
localStorage.setItem('zipstore_token', data.token);
localStorage.setItem('zipstore_user', JSON.stringify(data.user));
window.location.href = 'admin.html';
} catch (err) {
errorEl.textContent = err.message;
errorEl.style.display = 'block';
}
});
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
<script src="js/loader.js"></script>
</body>
</html>
